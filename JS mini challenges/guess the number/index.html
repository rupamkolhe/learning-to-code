<!Doctype html>

<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Guess the number</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googlapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script> 
</head>
<body>
	<p>Enter a guess between 0 and 100</p>
	<form>
		<input class="user-input" type="number" placeholder="Enter a number" max="100" min="0" required/>
		<div>
			<button class="submit-btn">Submit</button>
			<button class="start-game" type="button" disabled>Start Game</button>
		</div>
	</form>
	<p class="result"></p>
	<p class="all-guesses"><span></span></p>
</body>
</html>
