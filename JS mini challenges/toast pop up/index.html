<!Doctype html>

<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Toast Pop Up</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googlapis.com/css2?family=Nunito:wght@400;500;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script> 
</head>
<body>
	<h1>Toast Pop-Up</h1>
	<div class='container'>
		<select id='horizontal-position'>
			<option value='left'>Left</option>
			<option value='right'>Right</option>
		</select>
		<select id='vertical-position'>
			<option value='top'>Top</option>
			<option value='bottom'>Bottom</option>
		</select>
		<select id='toast-type'>
			<option value='success'>Success</option>
			<option value='error'>Error</option>
			<option value='warning'>Warning</option>
			<option value='info'>info</option>
		</select>
		<input id='toast-message' type='text' value='This is a toast message'/>
		<div class='duration-container'>
			<label for='duration'>Duration</label>
			<input id='duration' value=5 min=1 max=10 type='range'/>
		</div>
		<button class='show-toast'>Show Toast</button>
	</div>
	<div class='toast-container'>
		<!-- 
		<div class='toast'>✓ This is a toast message ✕</div>
		<div class='toast'>! This is a toast message ✕</div>
		<div class='toast'>⚠ This is a toast message ✕</div>
		<div class='toast'>ⓘ This is a toast message ✕</div>
		-->
	</div>
</body>
</html>
