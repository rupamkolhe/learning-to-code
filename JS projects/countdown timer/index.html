

<!DOCTYPE html>
<html lang='en'>
<head>
	<meta charset='UTF-8'>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<link rel='stylesheet' href='style.css'>
	<script src='script.js' defer></script>
	<link rel='preconnect' href='https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap'>

	<title>Countdown Timer</title>
</head>
<body>
	<h1>We are Coming Soon!</h1>
	<div class='countdown'>
		<div class='timer'>
			<span class='time' id='days'>10</span>
			<span class='label'>Days</span>
		</div>
		<div class='timer'>
			<span class='time' id='hours'>12</span>
			<span class='label'>Hours</span>
		</div>
		<div class='timer'>
			<span class='time' id='mins'>30</span>
			<span class='label'>Minutes</span>
		</div>
		<div class='timer'>
			<span class='time' id='secs'>12</span>
			<span class='label'>Seconds</span>
		</div>
	</div>
</body>
</html>
